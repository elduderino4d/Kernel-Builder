name: Build LineageOS 23 Shiba Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig patchutils
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Sync Kernel Source
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          git config --global user.name "Kernel Builder"
          git config --global user.email "bot@example.com"
          repo init -u https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git -b lineage-23.0 --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --fail-fast

      - name: Inject Patches & Extract Diagnostics
        run: |
          set -e 
          
          cd kernel_workspace/aosp
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          
          cd ..
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1
          
          cp -r susfs4ksu/kernel_patches/fs/* aosp/fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* aosp/include/linux/
          
          cd aosp
          PATCH_FILE="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
          
          # Isolate the failing file
          filterdiff -x 'a/fs/proc/base.c' -x 'b/fs/proc/base.c' $PATCH_FILE > main_susfs.patch
          filterdiff -i 'a/fs/proc/base.c' -i 'b/fs/proc/base.c' $PATCH_FILE > base_c_only.patch
          
          # Strictly apply the safe patches
          patch -p1 --no-backup-if-mismatch < main_susfs.patch
          
          # Allow base.c to fail gracefully so we can capture the specific error log
          patch -p1 --no-backup-if-mismatch < base_c_only.patch || true
          
          if [ -f "fs/proc/base.c.rej" ]; then
            echo "=================================================="
            echo "         SUSFS PATCH REJECTION DETECTED           "
            echo "=================================================="
            cat fs/proc/base.c.rej
            echo "=================================================="
            echo "STOPPING BUILD: To guarantee kernel stability, we will not guess where this code belongs."
            
            # Export logs to the root workspace so GitHub Actions can upload them
            mkdir -p $GITHUB_WORKSPACE/error_logs
            cp fs/proc/base.c.rej $GITHUB_WORKSPACE/error_logs/
            cp fs/proc/base.c $GITHUB_WORKSPACE/error_logs/
            exit 1
          fi

      - name: Upload Diagnostic Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Patch-Rejection-Logs
          path: error_logs/
