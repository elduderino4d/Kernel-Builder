name: Build LineageOS 23 Shiba Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Sync Kernel Source
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          git config --global user.name "Kernel Builder"
          git config --global user.email "bot@example.com"
          repo init -u https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git -b lineage-23.0 --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --fail-fast

      - name: Inject KernelSU Next & SUSFS
        run: |
          set -e 
          mkdir -p $GITHUB_WORKSPACE/diagnostic_logs
          
          cd kernel_workspace/aosp
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          
          cd ..
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1
          
          cp -r susfs4ksu/kernel_patches/fs/* aosp/fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* aosp/include/linux/
          
          cd aosp
          
          # 1. Temporarily add the missing header to base.c so the patch tool can find its anchor
          sed -i 's/#include <linux\/cpufreq_times.h>/#include <linux\/cpufreq_times.h>\n#include <linux\/dma-buf.h>/' fs/proc/base.c
          
          # 2. Apply the patch cleanly and save verbose output to a log file
          patch -p1 --no-backup-if-mismatch < ../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch 2>&1 | tee $GITHUB_WORKSPACE/diagnostic_logs/patch_injection.log
          
          # 3. Remove the injected header to maintain source purity
          sed -i '/#include <linux\/dma-buf.h>/d' fs/proc/base.c

      - name: Configure and Build
        run: |
          set -e
          cd kernel_workspace/aosp
          
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          
          cat <<EOF >> $CONFIG_FILE
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_EMPTY_DIR=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_ALGO=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          
          cd ..
          # Build with verbose failures enabled and save output to a log file
          tools/bazel run --config=fast --config=shusky --verbose_failures //private/devices/google/shusky:zuma_shusky_dist 2>&1 | tee $GITHUB_WORKSPACE/diagnostic_logs/bazel_build.log

      - name: Upload Diagnostic Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostic-Logs
          path: diagnostic_logs/
          if-no-files-found: warn

      - name: Validate and Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shiba-Lineage23-Boot
          path: kernel_workspace/out/**/dist/
          if-no-files-found: error
