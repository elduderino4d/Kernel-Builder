name: Build LineageOS 23 Shiba Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig patchutils python3
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Sync Kernel Source
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          git config --global user.name "Kernel Builder"
          git config --global user.email "bot@example.com"
          repo init -u https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git -b lineage-23.0 --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --fail-fast

      - name: Auto-Heal KernelSU Next & SUSFS
        run: |
          set -e 
          
          cd kernel_workspace/aosp
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -
          
          cd ..
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1
          
          cp -r susfs4ksu/kernel_patches/fs/* aosp/fs/
          cp -r susfs4ksu/kernel_patches/include/linux/* aosp/include/linux/
          
          cd aosp
          PATCH_FILE="../susfs4ksu/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch"
          
          # Use patchutils to split the patch into "everything else" and "the problematic file"
          filterdiff -x 'a/fs/proc/base.c' -x 'b/fs/proc/base.c' $PATCH_FILE > main_susfs.patch
          filterdiff -i 'a/fs/proc/base.c' -i 'b/fs/proc/base.c' $PATCH_FILE > base_c_only.patch
          
          # Strictly apply the main patch
          patch -p1 --no-backup-if-mismatch < main_susfs.patch
          
          # Loosely apply the base.c patch. This applies the successful hunks and generates a .rej for the failing one
          patch -p1 --no-backup-if-mismatch < base_c_only.patch || true
          
          # Auto-heal: Python reads the reject file and injects the missing hooks safely
          python3 -c '
          import os
          rej_file = "fs/proc/base.c.rej"
          if os.path.exists(rej_file):
              with open(rej_file, "r") as f:
                  lines = f.readlines()
              added_lines = [line[1:] for line in lines if line.startswith("+") and not line.startswith("+++")]
              if added_lines:
                  with open("fs/proc/base.c", "r") as f:
                      content = f.read()
                  
                  last_include = content.rfind("#include")
                  insert_idx = content.find("\n", last_include) + 1
                  
                  new_content = content[:insert_idx] + "".join(added_lines) + content[insert_idx:]
                  with open("fs/proc/base.c", "w") as f:
                      f.write(new_content)
                  print("SUCCESS: Auto-healed fs/proc/base.c dynamically.")
          '

      - name: Configure and Build
        run: |
          set -e
          cd kernel_workspace/aosp
          
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          
          cat <<EOF >> $CONFIG_FILE
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_EMPTY_DIR=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_ALGO=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF
          
          cd ..
          # Fixed Bazel target using the grouped 'shusky' directory and 'zuma' SoC combination
          tools/bazel run //private/devices/google/shusky:zuma_shusky_dist --config=fast

      - name: Validate and Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Shiba-Lineage23-Boot
          # The output directory has been updated to reflect the shusky build target
          path: kernel_workspace/out/shusky/dist/
          if-no-files-found: error
