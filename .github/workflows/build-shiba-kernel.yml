name: Build LineageOS 23.2 Boot Image (Pixel 8) with Standalone SuSFS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-boot-image:
    name: Build Pixel 8 LineageOS 23.2 SuSFS boot.img
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 jq

          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Set LineageOS 23.2 Branch
        run: |
          TARGET_BRANCH="lineage-23.2"

          REMOTE_CHECK=$(git ls-remote --heads https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git refs/heads/$TARGET_BRANCH)
          if [ -z "$REMOTE_CHECK" ]; then
            TARGET_BRANCH=$(git ls-remote --heads https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git | grep 'lineage-23' | awk -F/ '{print $3}' | sort -V | tail -n 1)
          fi

          echo "LineageOS Branch: $TARGET_BRANCH"
          echo "lineage_branch=$TARGET_BRANCH" >> $GITHUB_ENV

      - name: Sync LineageOS Kernel Tree
        run: |
          mkdir -p android-kernel && cd android-kernel
          repo init -u https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git -b ${{ env.lineage_branch }} --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

          # Find the real kernel source: has Makefile + fs/ + arch/arm64 + kernel/
          KDIR=""
          while IFS= read -r mk; do
            d=$(dirname "$mk")
            if [ -d "$d/fs" ] && [ -d "$d/arch/arm64" ] && [ -d "$d/kernel" ]; then
              KDIR="$d"; break
            fi
          done < <(find "$PWD" -maxdepth 4 -name Makefile -not -path '*/out/*' | sort)

          if [ -z "$KDIR" ]; then
            echo "::error::Could not locate kernel source tree"
            ls -la
            exit 1
          fi
          echo "Kernel source: $KDIR"
          echo "KERNEL_DIR=$KDIR" >> $GITHUB_ENV

      - name: Patch Standalone SuSFS into Kernel
        run: |
          cd "${{ env.KERNEL_DIR }}"
          pwd; ls

          # 1. Read kernel version
          K_VER=$(grep -E '^VERSION =' Makefile | awk '{print $3}')
          K_PATCH=$(grep -E '^PATCHLEVEL =' Makefile | awk '{print $3}')
          GKI_VERSION="${K_VER}.${K_PATCH}"
          echo "Detected kernel version: $GKI_VERSION"

          # 2. Clone SuSFS (prefer matching branch, fall back to default)
          rm -rf ../susfs4ksu
          git clone --depth=1 -b "gki-android14-${GKI_VERSION}" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu \
            || git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu

          # 3. Copy sources
          mkdir -p fs include/linux
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/

          # 4. Find matching patch
          MATCHED_PATCH=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_in_*gki*${GKI_VERSION}*.patch" | sort -V | tail -n 1)
          if [ -z "$MATCHED_PATCH" ]; then
            echo "No exact match for ${GKI_VERSION}, using latest GKI patch..."
            MATCHED_PATCH=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_in_*gki*.patch" | sort -V | tail -n 1)
          fi
          [ -n "$MATCHED_PATCH" ] || { echo "::error::No SuSFS patch found"; ls ../susfs4ksu/kernel_patches; exit 1; }

          echo "Applying SuSFS patch: $MATCHED_PATCH"
          patch -p1 --forward < "$MATCHED_PATCH" || {
            echo "::warning::Patch had rejects"
            find . -name '*.rej' | head
          }

          # 5. Inject configs
          for cfg in arch/arm64/configs/gki_defconfig arch/arm64/configs/shiba_defconfig; do
            if [ -f "$cfg" ]; then
              echo "Injecting SuSFS configs into $cfg"
              printf '%s\n' \
                CONFIG_KSU_SUSFS=y \
                CONFIG_KSU_SUSFS_SUS_MOUNT=y \
                CONFIG_KSU_SUSFS_SUS_PATH=y \
                CONFIG_KSU_SUSFS_SUS_KSTAT=y \
                CONFIG_KSU_SUSFS_SPOOF_UNAME=y >> "$cfg"
            fi
          done

      - name: Build boot.img
        run: |
          cd android-kernel
          LTO=thin BUILD_BOOT_IMG=1 build/build.sh

          mkdir -p ../dist_output
          find out -type f -name "boot.img" -exec cp {} ../dist_output/boot.img \;

      - name: Upload Raw boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-shiba-los23.2-susfs.img
          path: dist_output/boot.img
          if-no-files-found: error
