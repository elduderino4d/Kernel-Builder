name: Build LineageOS Boot Image (Pixel 8) with KernelSU & SuSFS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-boot-image:
    name: Build Pixel 8 boot.img
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 jq
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Detect Sources and Kernel Version
        id: detect
        run: |
          # 1. Fetch newest stable LineageOS branch for Pixel 8 (Zuma)
          LINEAGE_BRANCH=$(git ls-remote --heads https://github.com/LineageOS/android_kernel_google_zuma.git | grep 'refs/heads/lineage-' | awk -F/ '{print $3}' | sort -V | tail -n 1)
          echo "LineageOS Branch: $LINEAGE_BRANCH"
          echo "lineage_branch=$LINEAGE_BRANCH" >> $GITHUB_ENV

          # 2. Fetch latest KernelSU tag
          KSU_VERSION=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest | jq -r .tag_name)
          echo "KernelSU Version: $KSU_VERSION"
          echo "ksu_version=$KSU_VERSION" >> $GITHUB_ENV

          # 3. Fetch latest SuSFS release tag
          SUSFS_VERSION=$(git ls-remote --tags https://gitlab.com/simonpunk/susfs4ksu.git | grep -v '\^{}$' | awk -F/ '{print $3}' | sort -V | tail -n 1)
          echo "SuSFS Version: $SUSFS_VERSION"
          echo "susfs_version=$SUSFS_VERSION" >> $GITHUB_ENV

      - name: Fetch LineageOS Kernel Tree
        run: |
          mkdir -p android-kernel && cd android-kernel
          git clone https://github.com/LineageOS/android_kernel_google_zuma.git -b ${{ env.lineage_branch }} --depth=1 common
          echo "KERNEL_DIR=$PWD/common" >> $GITHUB_ENV

      - name: Setup KernelSU & Match SuSFS Patches
        run: |
          cd ${{ env.KERNEL_DIR }}

          # Install KernelSU
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s ${{ env.ksu_version }}

          # Clone SuSFS
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b ${{ env.susfs_version }} ../susfs4ksu

          # Apply SuSFS patch to KernelSU
          cp ../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch KernelSU/
          cd KernelSU
          patch -p1 < 10_enable_susfs_for_ksu.patch
          cd ..

          # Copy SuSFS header and fs source code directly as mandated by SuSFS docs
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

          # Detect matching GKI kernel patch (e.g., android14-6.1)
          # SuSFS docs dictate matching kernel-gki-*.patch to the underlying GKI major version
          MATCHED_PATCH=$(ls ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-gki-*.patch | sort -V | tail -n 1)
          echo "Applying matched GKI kernel patch: $MATCHED_PATCH"
          patch -p1 < "$MATCHED_PATCH" || true

          # Inject mandatory SuSFS configurations into defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/shiba_defconfig
          echo "CONFIG_KSU_SUSFS=y" >> arch/arm64/configs/shiba_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> arch/arm64/configs/shiba_defconfig
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> arch/arm64/configs/shiba_defconfig

      - name: Build boot.img File
        run: |
          cd android-kernel/common

          # Build GKI kernel with boot.img packing target
          LTO=thin BUILD_CONFIG=common/build.config.shiba BUILD_BOOT_IMG=1 build/build.sh

          # Stage final boot image output
          mkdir -p ../../dist_output
          find ../out -type f -name "boot.img" -exec cp {} ../../dist_output/boot.img \;

      - name: Export boot.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-shiba-susfs.img
          path: dist_output/boot.img
          if-no-files-found: error
