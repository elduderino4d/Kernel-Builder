name: Build LineageOS 23.2 Boot Image (Pixel 8) with Standalone SuSFS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-boot-image:
    name: Build Pixel 8 LineageOS 23.2 SuSFS boot.img
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 jq
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Set LineageOS Branch
        run: |
          M=https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git
          TARGET_BRANCH="lineage-23.2"
          CHECK=$(git ls-remote --heads $M refs/heads/$TARGET_BRANCH)
          if [ -z "$CHECK" ]; then
            TARGET_BRANCH=$(git ls-remote --heads $M | grep 'lineage-23' | awk -F/ '{print $3}' | sort -V | tail -n 1)
          fi
          echo "LineageOS Branch: $TARGET_BRANCH"
          echo "lineage_branch=$TARGET_BRANCH" >> $GITHUB_ENV

      - name: Sync LineageOS Kernel Tree
        run: |
          mkdir -p android-kernel
          cd android-kernel
          repo init -u https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git -b ${{ env.lineage_branch }} --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          KDIR=""
          while IFS= read -r mk; do
            d=$(dirname "$mk")
            if [ -d "$d/fs" ] && [ -d "$d/arch/arm64" ] && [ -d "$d/kernel" ]; then
              KDIR="$d"
              break
            fi
          done < <(find "$PWD" -maxdepth 4 -name Makefile -not -path '*/out/*' | sort)
          if [ -z "$KDIR" ]; then
            echo "::error::Could not locate kernel source tree"
            ls -la
            exit 1
          fi
          echo "Kernel source: $KDIR"
          echo "KERNEL_DIR=$KDIR" >> $GITHUB_ENV

      - name: Patch Standalone SuSFS into Kernel
        run: |
          cd "${{ env.KERNEL_DIR }}"
          pwd
          ls
          K_VER=$(grep -E '^VERSION =' Makefile | awk '{print $3}')
          K_PATCH=$(grep -E '^PATCHLEVEL =' Makefile | awk '{print $3}')
          GKI_VERSION="${K_VER}.${K_PATCH}"
          echo "Detected kernel version: $GKI_VERSION"
          rm -rf ../susfs4ksu
          git clone --depth=1 -b "gki-android14-${GKI_VERSION}" https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu || git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          mkdir -p fs include/linux
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          P=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_in_*gki*${GKI_VERSION}*.patch" | sort -V | tail -n 1)
          if [ -z "$P" ]; then
            echo "No exact match, using latest GKI patch..."
            P=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_in_*gki*.patch" | sort -V | tail -n 1)
          fi
          if [ -z "$P" ]; then
            echo "::error::No SuSFS patch found"
            ls ../susfs4ksu/kernel_patches
            exit 1
          fi
          echo "Applying SuSFS patch: $P"
          patch -p1 --forward < "$P" || echo "::warning::Patch had rejects"
          for cfg in arch/arm64/configs/gki_defconfig arch/arm64/configs/shiba_defconfig; do
            if [ -f "$cfg" ]; then
              echo "Injecting SuSFS configs into $cfg"
              printf '%s\n' CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_MOUNT=y CONFIG_KSU_SUSFS_SUS_PATH=y CONFIG_KSU_SUSFS_SUS_KSTAT=y CONFIG_KSU_SUSFS_SPOOF_UNAME=y >> "$cfg"
            fi
          done

      - name: Build boot.img
        run: |
          cd android-kernel
          ls
          mkdir -p ../dist_output out/dist
          set +e
          tools/bazel run --lto=thin --config=stamp //aosp:kernel_aarch64_dist -- --destdir="$PWD/out/dist" > ../build.log 2>&1
          RC=$?
          set -e
          tail -n 60 ../build.log
          if [ $RC -ne 0 ]; then
            echo "=========== BUILD FAILED (exit $RC) ==========="
            echo "----- first ERROR lines -----"
            grep -n -m 40 -E "ERROR|error:|fatal|FAILED" ../build.log || true
            echo "----- available dist targets -----"
            tools/bazel query 'kind("copy_to_dist_dir", //...)' --keep_going 2>/dev/null || true
            exit 1
          fi
          find out -type f -name "boot*.img"
          BOOT=$(find out -type f -name boot.img | head -n 1)
          if [ -z "$BOOT" ]; then
            echo "::error::boot.img not found in output"
            find out -type f | head -n 50
            exit 1
          fi
          cp "$BOOT" ../dist_output/boot.img

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload Raw boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-shiba-los23.2-susfs.img
          path: dist_output/boot.img
          if-no-files-found: error