name: Build LineageOS Boot Image (Pixel 8) with Standalone SuSFS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-boot-image:
    name: Build Pixel 8 Standalone SuSFS boot.img
    # Switched to ubuntu-22.04 to prevent Bazel sandbox permission errorsname: Build LineageOS Boot Image (Pixel 8) with Standalone SuSFS

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build-boot-image:
    name: Build Pixel 8 Standalone SuSFS boot.img
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 jq
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Detect Latest LineageOS Branch
        id: detect
        run: |
          # Query latest lineage branch for Google Zuma kernel
          DETECTED_BRANCH=$(git ls-remote --heads https://github.com/LineageOS/android_kernel_google_zuma.git | grep 'refs/heads/lineage-' | awk -F/ '{print $3}' | sort -V | tail -n 1)
          
          # Fallback if git ls-remote returns empty string
          if [ -z "$DETECTED_BRANCH" ]; then
            DETECTED_BRANCH="lineage-22.1"
          fi
          
          echo "LineageOS Branch: $DETECTED_BRANCH"
          echo "lineage_branch=$DETECTED_BRANCH" >> $GITHUB_ENV

      - name: Fetch LineageOS Kernel Tree
        run: |
          mkdir -p android-kernel && cd android-kernel
          git clone https://github.com/LineageOS/android_kernel_google_zuma.git -b ${{ env.lineage_branch }} --depth=1 common
          echo "KERNEL_DIR=$PWD/common" >> $GITHUB_ENV

      - name: Patch Standalone SuSFS into Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}

          # Fetch SuSFS repository cleanly
          git clone https://gitlab.com/simonpunk/susfs4ksu.git ../susfs4ksu
          cd ../susfs4ksu
          
          # Checkout latest tag if available, otherwise stay on main branch
          LATEST_TAG=$(git tag -l | sort -V | tail -n 1)
          if [ -n "$LATEST_TAG" ]; then
            git checkout "$LATEST_TAG"
          fi
          cd ${{ env.KERNEL_DIR }}

          # Copy core SuSFS files and headers into kernel tree
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/ 2>/dev/null || cp -r ../susfs4ksu/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/ 2>/dev/null || cp -r ../susfs4ksu/include/linux/* include/linux/

          # Detect and apply matching GKI kernel patch (e.g. android14-6.1 / android15-6.6)
          MATCHED_PATCH=$(find ../susfs4ksu/ -name "50_add_susfs_in_kernel-gki-*.patch" | sort -V | tail -n 1)
          if [ -n "$MATCHED_PATCH" ]; then
            echo "Applying GKI kernel patch: $MATCHED_PATCH"
            patch -p1 < "$MATCHED_PATCH" || true
          fi

          # Inject standalone SuSFS kernel flags into defconfig
          DEFCONFIG_FILE="arch/arm64/configs/gki_defconfig"
          if [ -f "arch/arm64/configs/shiba_defconfig" ]; then
            DEFCONFIG_FILE="arch/arm64/configs/shiba_defconfig"
          fi

          echo "CONFIG_SUSFS=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_SUSFS_SUS_PATH=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG_FILE"

      - name: Build boot.img
        run: |
          cd android-kernel/common

          # Build Kleaf boot image target for Pixel 8 (Tensor G3)
          LTO=thin BUILD_BOOT_IMG=1 build/build.sh || LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 BUILD_BOOT_IMG=1 build/build.sh

          # Stage output boot image
          mkdir -p ../../dist_output
          find ../out -type f -name "boot.img" -exec cp {} ../../dist_output/boot.img \;

      - name: Upload Raw boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-shiba-susfs.img
          path: dist_output/boot.img
          if-no-files-found: error

    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
            libssl-dev libxml2 libxml2-utils lzop pngcrush rsync \
            schedtool squashfs-tools xsltproc zip zlib1g-dev python3 jq
          
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Detect Latest LineageOS & SuSFS
        id: detect
        run: |
          # 1. Detect newest stable LineageOS branch for Pixel 8 (Google Zuma)
          LINEAGE_BRANCH=$(git ls-remote --heads https://github.com/LineageOS/android_kernel_google_zuma.git | grep 'refs/heads/lineage-' | awk -F/ '{print $3}' | sort -V | tail -n 1)
          echo "LineageOS Branch: $LINEAGE_BRANCH"
          echo "lineage_branch=$LINEAGE_BRANCH" >> $GITHUB_ENV

          # 2. Detect latest stable SuSFS tag from simonpunk's repository
          SUSFS_VERSION=$(git ls-remote --tags https://gitlab.com/simonpunk/susfs4ksu.git | grep -v '\^{}$' | awk -F/ '{print $3}' | sort -V | tail -n 1)
          echo "SuSFS Version: $SUSFS_VERSION"
          echo "susfs_version=$SUSFS_VERSION" >> $GITHUB_ENV

      - name: Fetch LineageOS Kernel Tree
        run: |
          mkdir -p android-kernel && cd android-kernel
          git clone https://github.com/LineageOS/android_kernel_google_zuma.git -b ${{ env.lineage_branch }} --depth=1 common
          echo "KERNEL_DIR=$PWD/common" >> $GITHUB_ENV

      - name: Patch Standalone SuSFS into Kernel
        run: |
          cd ${{ env.KERNEL_DIR }}

          # Fetch SuSFS
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b ${{ env.susfs_version }} ../susfs4ksu

          # Copy core SuSFS C files and header interfaces directly into kernel source tree
          cp -r ../susfs4ksu/kernel_patches/fs/* fs/
          cp -r ../susfs4ksu/kernel_patches/include/linux/* include/linux/

          # Detect and apply matching GKI kernel patch (e.g. android14-6.1)
          MATCHED_PATCH=$(ls ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-gki-*.patch | sort -V | tail -n 1)
          echo "Applying GKI kernel patch: $MATCHED_PATCH"
          patch -p1 < "$MATCHED_PATCH" || true

          # Inject mandatory standalone SuSFS kernel configs into GKI defconfig
          DEFCONFIG_FILE="arch/arm64/configs/gki_defconfig"
          if [ -f "arch/arm64/configs/shiba_defconfig" ]; then
            DEFCONFIG_FILE="arch/arm64/configs/shiba_defconfig"
          fi

          echo "CONFIG_SUSFS=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_SUSFS_SUS_MOUNT=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_SUSFS_SUS_PATH=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_SUSFS_SUS_KSTAT=y" >> "$DEFCONFIG_FILE"
          echo "CONFIG_SUSFS_SPOOF_UNAME=y" >> "$DEFCONFIG_FILE"

      - name: Build boot.img
        run: |
          cd android-kernel/common

          # Build Bazel/Kleaf boot image target for Pixel 8 (Tensor G3)
          LTO=thin BUILD_BOOT_IMG=1 build/build.sh || LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 BUILD_BOOT_IMG=1 build/build.sh

          # Stage final boot image output
          mkdir -p ../../dist_output
          find ../out -type f -name "boot.img" -exec cp {} ../../dist_output/boot.img \;

      - name: Upload Raw boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-shiba-susfs.img
          path: dist_output/boot.img
          if-no-files-found: error
