name: Build LineageOS 23 Shiba Kernel (KSU-Next + SUSFS)

on:
  workflow_dispatch: # This adds a "Run workflow" button in GitHub

jobs:
  build-kernel:
    name: Compile Kernel
    runs-on: ubuntu-24.04
    
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig

      - name: Install Android Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync LineageOS 23 Kernel Source
        run: |
          mkdir kernel_workspace && cd kernel_workspace
          git config --global user.name "Kernel Builder"
          git config --global user.email "bot@example.com"
          # Syncing the Pixel 8 (Shiba) manifest for LOS 23
          repo init -u https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git -b lineage-23.0 --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags

      - name: Inject KernelSU Next
        run: |
          cd kernel_workspace/aosp
          # This downloads the absolute latest KSU-Next code
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -

      - name: Download & Apply SUSFS Patches
        run: |
          cd kernel_workspace
          # Fetch the SUSFS source
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-6.1
          
          cd aosp
          # 1. Copy SUSFS core files into the kernel
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          
          # 2. Apply the kernel routing patches
          patch -p1 < ../susfs4ksu/kernel_patches/50_recipe_for_6.1.patch || true
          patch -p1 < ../susfs4ksu/kernel_patches/fs/susfs_defconfig.patch || true

      - name: Inject Configuration (Defconfigs)
        run: |
          cd kernel_workspace/aosp
          
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"
          
          # Activate KernelSU Next
          echo "CONFIG_KSU=y" >> $CONFIG_FILE
          
          # Activate all SUSFS hiding features
          echo "CONFIG_KSU_SUSFS=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_PATH=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_MOUNT=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_EMPTY_DIR=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_SUSFS_ENABLE_ALGO=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" >> $CONFIG_FILE
          echo "CONFIG_KSU_SUSFS_SUS_SU=y" >> $CONFIG_FILE

      - name: Compile Kernel
        run: |
          cd kernel_workspace
          # Compile using Google's build system
          tools/bazel run //private/gs-google:shiba_dist --config=fast

      - name: Upload Finished Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Pixel8-Shiba-Kernel
          path: kernel_workspace/out/shiba/dist/
