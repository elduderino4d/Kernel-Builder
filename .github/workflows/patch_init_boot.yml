name: Patch Pixel 8 (shiba) LineageOS init_boot with KernelSU (LKM)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Optional: Automatically runs every Sunday at midnight

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y jq curl wget

    - name: Fetch latest LineageOS (shiba) init_boot
      run: |
        # Query LineageOS v2 API for the newest Pixel 8 build and extract the init_boot.img URL
        INIT_BOOT_URL=$(curl -s "https://download.lineageos.org/api/v2/devices/shiba/builds" | jq -r '.[0].files[] | select(.filename == "init_boot.img") | .url')
        
        # Failsafe check
        if [ -z "$INIT_BOOT_URL" ] || [ "$INIT_BOOT_URL" == "null" ]; then
          echo "Error: Could not find init_boot.img in the latest build API response."
          exit 1
        fi
        
        echo "Downloading init_boot.img from: $INIT_BOOT_URL"
        wget -q "$INIT_BOOT_URL" -O init_boot.img

    - name: Setup KernelSU CLI (ksud)
      run: |
        # Grab the latest Linux x86_64 musl binary of ksud (Note: distributed as a raw binary, not a tarball)
        KSUD_URL=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest | jq -r '.assets[] | select(.name == "ksud-x86_64-unknown-linux-musl") | .browser_download_url' | head -n 1)
        wget -qO /usr/local/bin/ksud "$KSUD_URL"
        sudo chmod +x /usr/local/bin/ksud

    - name: Patch init_boot.img with KernelSU (LKM Mode)
      run: |
        # ksud uses its built-in bootimg parser (magiskboot is no longer required).
        # Because init_boot lacks a kernel to sniff the KMI from, we must explicitly declare it.
        # Pixel 8 (Tensor G3) on Android 14 uses the android14-6.1 KMI.
        ksud boot-patch -b init_boot.img --kmi android14-6.1
        
        # Verify the patched file was created
        ls -la kernelsu_*.img || echo "Failed to locate patched image"

    - name: Upload Patched Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kernelsu_patched_init_boot_shiba
        path: kernelsu_*.img
        retention-days: 7
