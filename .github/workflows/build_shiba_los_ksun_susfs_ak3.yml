name: Build LineageOS Kernel (Pixel 8) with Official KSU-Next & SUSFS
on:
  workflow_dispatch:
    inputs:
      lineage_branch:
        description: 'LineageOS branch (auto = newest available)'
        required: false
        default: 'lineage-23.2'

jobs:
  build-boot-image:
    name: Build Pixel 8 LineageOS KernelSU-Next and SUSFS AnyKernel3 zip
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Init logging
      run: |
        mkdir -p "$GITHUB_WORKSPACE/.ci" "$GITHUB_WORKSPACE/logs"
        touch "$GITHUB_WORKSPACE/build.log"
        cat > "$GITHUB_WORKSPACE/.ci/stepinit.sh" << 'HELPEREOF'
        STEP_NAME="$1"
        LOGDIR="$GITHUB_WORKSPACE/logs"
        LOGFILE="$LOGDIR/full-workflow.log"
        mkdir -p "$LOGDIR"
        exec > >(tee -a "$LOGFILE") 2>&1
        export PS4='+ [L${LINENO}] '
        echo ""
        echo "=================================================================="
        echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] STEP START: ${STEP_NAME}"
        echo "=================================================================="
        STEP_T0=$(date +%s)
        trap 'rc=$?; set +x; D=$(( $(date +%s) - STEP_T0 )); echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] STEP END: ${STEP_NAME} exit=${rc} duration=${D}s"; echo "disk: $(df -h / | tail -n 1)"; printf "%s\t%s\t%s\n" "${STEP_NAME}" "${rc}" "${D}" >> "$LOGDIR/summary.tsv"; sleep 1' EXIT
        set -x
        HELPEREOF
        source "$GITHUB_WORKSPACE/.ci/stepinit.sh" "Init logging"
        echo "Requested LineageOS branch input: ${{ inputs.lineage_branch }}"

    - name: Install Dependencies
      run: |
        source "$GITHUB_WORKSPACE/.ci/stepinit.sh" "Install Dependencies"
        sudo apt-get update
        sudo apt-get install -y -V bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 jq
        mkdir -p ~/bin
        curl -fSL -w '\nHTTP %{http_code} size=%{size_download}\n' https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Prepare AnyKernel3
      run: |
        source "$GITHUB_WORKSPACE/.ci/stepinit.sh" "Prepare AnyKernel3"
        git clone -v --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
        rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md
        cat > AnyKernel3/anykernel.sh << 'AKEOF'
        ### AnyKernel3 Ramdisk Mod Script
        properties() { '
        kernel.string=KernelSU-Next + SUSFS for Pixel 8 (shiba) - LineageOS
        do.devicecheck=1
        do.modules=0
        do.systemless=0
        do.cleanup=1
        do.cleanuponabort=0
        device.name1=shiba
        supported.versions=
        supported.patchlevels=
        supported.vendorpatchlevels=
        '; }
        BLOCK=boot;
        IS_SLOT_DEVICE=auto;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=auto;
        SLOT_SELECT=active;
        . tools/ak3-core.sh;
        ui_print " ";
        ui_print "Flashing kernel to the ACTIVE slot...";
        split_boot;
        flash_boot;
        ui_print " ";
        ui_print "Flashing kernel to the INACTIVE slot...";
        BLOCK=boot;
        IS_SLOT_DEVICE=auto;
        RAMDISK_COMPRESSION=auto;
        PATCH_VBMETA_FLAG=auto;
        SLOT_SELECT=inactive;
        reset_ak;
        split_boot;
        flash_boot;
        AKEOF

    - name: Sync LineageOS Kernel Tree
      env:
        INPUT_BRANCH: ${{ inputs.lineage_branch }}
      run: |
        source "$GITHUB_WORKSPACE/.ci/stepinit.sh" "Sync LineageOS Kernel Tree"
        M=https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git
        CANDIDATES=$(git ls-remote --heads $M | awk -F'refs/heads/' '{print $2}' | grep -E '^lineage-[0-9]+(\.[0-9]+)?$' | sort -V -r)
        if [ -n "$INPUT_BRANCH" ] && [ "$INPUT_BRANCH" != "auto" ]; then
          CANDIDATES="$INPUT_BRANCH"
        fi
        mkdir -p android-kernel
        cd android-kernel
        OK=""
        for b in $CANDIDATES; do
          rm -rf .repo
          if repo init -u $M -b "$b" --depth=1; then OK="$b"; break; fi
        done
        echo "Using LineageOS branch: $OK"
        echo "lineage_branch=$OK" >> $GITHUB_ENV
        repo sync -v -c -j$(nproc --all) --no-tags --no-clone-bundle
        KDIR=""
        while IFS= read -r mk; do
          d=$(dirname "$mk")
          if [ -d "$d/fs" ] && [ -d "$d/arch/arm64" ] && [ -d "$d/kernel" ]; then KDIR="$d"; break; fi
        done < <(find "$PWD" -maxdepth 4 -name Makefile -not -path '*/out/*' | sort)
        REL="${KDIR#$PWD/}"
        echo "KERNEL_DIR=$KDIR" >> $GITHUB_ENV
        echo "KERNEL_REL=$REL" >> $GITHUB_ENV

    - name: Integrate KernelSU-Next and SUSFS
      run: |
        source "$GITHUB_WORKSPACE/.ci/stepinit.sh" "Integrate KernelSU-Next and SUSFS"
        cd "${{ env.KERNEL_DIR }}"
        
        KSU_REPO=https://github.com/rifsxd/KernelSU-Next
        KSU_BRANCH=dev
        
        rm -rf KernelSU-Next drivers/kernelsu
        git clone -v --single-branch -b "$KSU_BRANCH" "$KSU_REPO" KernelSU-Next
        KSU_COUNT=$(git -C KernelSU-Next rev-list --count HEAD)
        KSU_TAG=$(git -C KernelSU-Next describe --tags --abbrev=0 2>/dev/null || echo v0.0.1)
        
        cp -rL KernelSU-Next/kernel drivers/kernelsu
        if [ ! -f drivers/kernelsu/uapi/app_profile.h ]; then
          F=$(find KernelSU-Next -name 'app_profile.h' | head -n 1)
          mkdir -p drivers/kernelsu/uapi
          cp -rL "$(dirname "$F")"/. drivers/kernelsu/uapi/
        fi
        
        KB=drivers/kernelsu/Kbuild
        [ -f "$KB" ] || KB=drivers/kernelsu/Makefile
        {
          echo "override KSU_GIT_VERSION := ${KSU_COUNT}"
          echo "override KSU_VERSION_TAG := ${KSU_TAG}"
          cat "$KB"
        } > "$KB.new"
        mv "$KB.new" "$KB"
        rm -rf KernelSU-Next
        
        grep -q "kernelsu" drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
        if ! grep -q "kernelsu" drivers/Kconfig; then
          LN=$(grep -n '^endmenu' drivers/Kconfig | tail -n 1 | cut -d: -f1)
          sed -i "${LN}i source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
        fi
        
        K_VER=$(grep -E '^VERSION =' Makefile | awk '{print $3}')
        K_PATCH=$(grep -E '^PATCHLEVEL =' Makefile | awk '{print $3}')
        GKI_VERSION="${K_VER}.${K_PATCH}"
        SUSFS_URL=https://gitlab.com/simonpunk/susfs4ksu.git
        SB=$(git ls-remote --heads "$SUSFS_URL" | awk -F'refs/heads/' '{print $2}' | grep -E "^gki-android[0-9]+-${GKI_VERSION}$" | sort -V | tail -n 1)
        
        rm -rf ../susfs4ksu
        git clone -v --depth=1 -b "$SB" "$SUSFS_URL" ../susfs4ksu
        mkdir -p fs include/linux
        cp -v ../susfs4ksu/kernel_patches/fs/* fs/
        cp -v ../susfs4ksu/kernel_patches/include/linux/* include/linux/
        P=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_in_*.patch" | sort -V | tail -n 1)
        
        set +e
        patch -p1 --forward --verbose < "$P"
        set -e
        
        REJ=$(find . -name '*.rej' -not -path './out/*')
        if [ "$REJ" = "./fs/namespace.c.rej" ] && ! grep -q "susfs_def.h" fs/namespace.c; then
        python3 - << 'PYEOF'
        p = 'fs/namespace.c'
        s = open(p).read()
        a = '#include "pnode.h"\n'
        b = '#include "internal.h"\n'
        inc = '#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n'
        ext = '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n'
        s = s.replace(a, inc + a, 1)
        s = s.replace(b, b + ext, 1)
        open(p, 'w').write(s)
        PYEOF
          rm -f fs/namespace.c.rej fs/namespace.c.orig
        fi
        
        echo "Defining and forcing KernelSU & SUSFS Kconfigs to 'y'..."
        
        # 1. Force KernelSU variables to default 'y'
        sed -i 's/default n/default y/g' drivers/kernelsu/Kconfig
        
        # 2. Declare SUSFS definitions missing from the official KSU repo
        cat << 'EOF' >> drivers/kernelsu/Kconfig

        config KSU_SUSFS
            bool "KernelSU SUSFS"
            default y
        config KSU_SUSFS_SUS_MOUNT
            bool "KernelSU SUSFS sus_mount"
            depends on KSU_SUSFS
            default y
        config KSU_SUSFS_SUS_PATH
            bool "KernelSU SUSFS sus_path"
            depends on KSU_SUSFS
            default y
        config KSU_SUSFS_SUS_KSTAT
            bool "KernelSU SUSFS sus_kstat"
            depends on KSU_SUSFS
            default y
        config KSU_SUSFS_SPOOF_UNAME
            bool "KernelSU SUSFS spoof_uname"
            depends on KSU_SUSFS
            default y
        EOF

    - name: Build boot.img
      run: |
        source "$GITHUB_WORKSPACE/.ci/stepinit.sh" "Build boot.img"
        cd android-kernel
        mkdir -p ../dist_output out/dist
        
        TARGET="//${{ env.KERNEL_REL }}:kernel_aarch64_dist"
        if ! tools/bazel query "$TARGET" >/dev/null 2>&1; then
          TARGET=$(tools/bazel query 'kind(copy_to_dist_dir, //...)' 2>/dev/null | grep -E 'kernel_aarch64_dist$' | head -n 1)
        fi
        
        {
          echo "WORKFLOW ksunext-susfs-v6 run ${{ github.run_number }}"
          echo "LINEAGE_BRANCH=${{ env.lineage_branch }}"
          echo "TARGET=$TARGET"
          echo "-----"
        } > ../build.log
        
        set +e
        tools/bazel run --lto=thin --config=stamp "$TARGET" -- --destdir="$PWD/out/dist" >> ../build.log 2>&1
        RC=$?
        set -e
        sync
        sleep 1
        
        if [ $RC -ne 0 ]; then
          echo "=========== BUILD FAILED (exit $RC) ==========="
          grep -n -m 40 -E "ERROR|error:|fatal|FAILED|Unrecognized" ../build.log || true
          exit 1
        fi
        
        VML=$(find out/dist -maxdepth 1 -name vmlinux | head -n 1)
        if [ -n "$VML" ]; then
          if grep -aq "susfs" "$VML" && grep -aq "ksu_" "$VML"; then
            echo "Verified: KernelSU and SUSFS symbols are in vmlinux"
          else
            echo "::error::KernelSU or SUSFS symbols are missing from vmlinux, config did not enable them"
            exit 1
          fi
        fi
        
        BOOT=$(find out -type f -name boot.img | head -n 1)
        cp -v "$BOOT" ../dist_output/boot.img

    - name: Package AnyKernel3 zip
      run: |
        source "$GITHUB_WORKSPACE/.ci/stepinit.sh" "Package AnyKernel3 zip"
        IMG=""
        for f in Image.lz4 Image.gz Image; do
          if [ -f "android-kernel/out/dist/$f" ]; then
            IMG="android-kernel/out/dist/$f"
            break
          fi
        done
        cp -v "$IMG" AnyKernel3/
        ZIP="AK3-KSUNext-SUSFS-shiba-${{ env.lineage_branch }}-$(date +%Y%m%d).zip"
        cd AnyKernel3
        zip -r9 -v "../dist_output/$ZIP" . -x '.git*' 'README.md' '*placeholder'

    - name: Verify outputs
      run: |
        source "$GITHUB_WORKSPACE/.ci/stepinit.sh" "Verify outputs"
        cd "$GITHUB_WORKSPACE"
        ZIP=$(ls dist_output/AK3-*.zip | head -n 1)
        if [ -z "$ZIP" ]; then exit 1; fi
        unzip -t "$ZIP"
        if ! unzip -l "$ZIP" | grep -E ' (Image|Image\.lz4|Image\.gz)$'; then exit 1; fi

    - name: Final summary
      if: always()
      run: |
        source "$GITHUB_WORKSPACE/.ci/stepinit.sh" "Final summary"
        set +x
        cd "$GITHUB_WORKSPACE"
        touch logs/summary.tsv
        EXPECTED=("Init logging" "Install Dependencies" "Prepare AnyKernel3" "Sync LineageOS Kernel Tree" "Integrate KernelSU-Next and SUSFS" "Build boot.img" "Package AnyKernel3 zip" "Verify outputs")
        FAILS=0
        for s in "${EXPECTED[@]}"; do
          R=$(awk -F'\t' -v s="$s" '$1==s{rc=$2;d=$3;f=1} END{if(!f)print "NOT RUN\t-"; else if(rc==0)print "PASSED\t" d "s"; else print "FAILED (exit " rc ")\t" d "s"}' logs/summary.tsv)
          RES=$(echo "$R" | cut -f1)
          if [ "$RES" != "PASSED" ]; then FAILS=$((FAILS + 1)); fi
        done
        if [ "$FAILS" -eq 0 ]; then
          echo "ALL TASKS PASSED" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "**$FAILS task(s) did not pass**" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload AnyKernel3 zip
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-shiba-${{ env.lineage_branch }}-KSUNext-SUSFS
        path: dist_output/AK3-*.zip
        if-no-files-found: error

    - name: Upload Raw boot.img
      uses: actions/upload-artifact@v4
      with:
        name: boot-shiba-${{ env.lineage_branch }}-kernelsu-next-susfs.img
        path: dist_output/boot.img
        if-no-files-found: error
