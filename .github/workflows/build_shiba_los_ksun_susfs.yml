name: Build LineageOS Kernel (Pixel 8) with KernelSU-Next and SUSFS

on:
  workflow_dispatch:
    inputs:
      lineage_branch:
        description: 'LineageOS branch (auto = newest available)'
        required: false
        default: 'auto'

jobs:
  build-boot-image:
    name: Build Pixel 8 LineageOS KernelSU-Next and SUSFS AnyKernel3 zip
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 jq
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Prepare AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/.github AnyKernel3/README.md
          if ! grep -q "SLOT_SELECT" AnyKernel3/tools/ak3-core.sh; then
            echo "::error::This AnyKernel3 version has no SLOT_SELECT support, cannot flash both slots"
            exit 1
          fi
          cat > AnyKernel3/anykernel.sh << 'AKEOF'
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=KernelSU-Next + SUSFS for Pixel 8 (shiba) - LineageOS
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=shiba
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          SLOT_SELECT=active;

          . tools/ak3-core.sh;

          ui_print " ";
          ui_print "Flashing kernel to the ACTIVE slot...";
          split_boot;
          flash_boot;

          ui_print " ";
          ui_print "Flashing kernel to the INACTIVE slot...";
          BLOCK=boot;
          IS_SLOT_DEVICE=auto;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;
          SLOT_SELECT=inactive;
          reset_ak;
          split_boot;
          flash_boot;
          AKEOF
          echo "AnyKernel3 ready:"
          ls -la AnyKernel3

      - name: Sync LineageOS Kernel Tree
        env:
          INPUT_BRANCH: ${{ inputs.lineage_branch }}
        run: |
          M=https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git
          if [ -n "$INPUT_BRANCH" ] && [ "$INPUT_BRANCH" != "auto" ]; then
            CANDIDATES="$INPUT_BRANCH"
          else
            CANDIDATES=$(git ls-remote --heads $M | awk -F'refs/heads/' '{print $2}' | grep -E '^lineage-[0-9]+(\.[0-9]+)?$' | sort -V -r)
          fi
          if [ -z "$CANDIDATES" ]; then
            echo "::error::No LineageOS branches found on manifest repo"
            git ls-remote --heads $M | head -n 30
            exit 1
          fi
          echo "Candidate branches (newest first):"
          echo "$CANDIDATES"
          mkdir -p android-kernel
          cd android-kernel
          OK=""
          for b in $CANDIDATES; do
            echo "Trying branch: $b"
            rm -rf .repo
            if repo init -u $M -b "$b" --depth=1; then
              OK="$b"
              break
            fi
          done
          if [ -z "$OK" ]; then
            echo "::error::repo init failed for every candidate branch"
            exit 1
          fi
          echo "Using LineageOS branch: $OK"
          echo "lineage_branch=$OK" >> $GITHUB_ENV
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle
          KDIR=""
          while IFS= read -r mk; do
            d=$(dirname "$mk")
            if [ -d "$d/fs" ] && [ -d "$d/arch/arm64" ] && [ -d "$d/kernel" ]; then
              KDIR="$d"
              break
            fi
          done < <(find "$PWD" -maxdepth 4 -name Makefile -not -path '*/out/*' | sort)
          if [ -z "$KDIR" ]; then
            echo "::error::Could not locate kernel source tree"
            ls -la
            exit 1
          fi
          REL="${KDIR#$PWD/}"
          if [ "$REL" = "$KDIR" ] || [ -z "$REL" ]; then
            echo "::error::Kernel source is not in a subfolder of the workspace: $KDIR"
            exit 1
          fi
          echo "Kernel source: $KDIR (package: $REL)"
          echo "KERNEL_DIR=$KDIR" >> $GITHUB_ENV
          echo "KERNEL_REL=$REL" >> $GITHUB_ENV

      - name: Integrate KernelSU-Next and SUSFS
        run: |
          echo "WORKFLOW ksunext-susfs-v2 run ${{ github.run_number }}"
          cd "${{ env.KERNEL_DIR }}"

          KSU_REPO=https://github.com/pershoot/KernelSU-Next
          KSU_BRANCH=dev-susfs
          if ! git ls-remote --exit-code --heads "$KSU_REPO" "$KSU_BRANCH" > /dev/null; then
            echo "::error::Branch $KSU_BRANCH not found in $KSU_REPO"
            git ls-remote --heads "$KSU_REPO" | head -n 30
            exit 1
          fi
          rm -rf KernelSU-Next drivers/kernelsu
          git clone --single-branch -b "$KSU_BRANCH" "$KSU_REPO" KernelSU-Next
          echo "KernelSU-Next commit: $(git -C KernelSU-Next rev-parse --short HEAD)"
          echo "KernelSU-Next tag: $(git -C KernelSU-Next describe --tags 2>/dev/null || echo none)"
          echo "KernelSU-Next commit count: $(git -C KernelSU-Next rev-list --count HEAD)"
          cp -r KernelSU-Next/kernel drivers/kernelsu
          rm -rf KernelSU-Next

          grep -q "kernelsu" drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          if ! grep -q "kernelsu" drivers/Kconfig; then
            LN=$(grep -n '^endmenu' drivers/Kconfig | tail -n 1 | cut -d: -f1)
            sed -i "${LN}i source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig
          fi
          grep -n "kernelsu" drivers/Makefile drivers/Kconfig
          if ! grep -rqi "susfs" drivers/kernelsu; then
            echo "::error::This KernelSU-Next branch has no SUSFS support"
            exit 1
          fi
          echo "KernelSU config symbols:"
          grep -rhE '^config KSU' drivers/kernelsu --include=Kconfig || true
          echo "KernelSU version logic:"
          grep -n "VERSION" drivers/kernelsu/Makefile | head -n 20 || true

          K_VER=$(grep -E '^VERSION =' Makefile | awk '{print $3}')
          K_PATCH=$(grep -E '^PATCHLEVEL =' Makefile | awk '{print $3}')
          GKI_VERSION="${K_VER}.${K_PATCH}"
          echo "Detected kernel version: $GKI_VERSION"
          SUSFS_URL=https://gitlab.com/simonpunk/susfs4ksu.git
          SB=$(git ls-remote --heads "$SUSFS_URL" | awk -F'refs/heads/' '{print $2}' | grep -E "^gki-android[0-9]+-${GKI_VERSION}$" | sort -V | tail -n 1)
          if [ -z "$SB" ]; then
            echo "::error::No SUSFS branch found for kernel $GKI_VERSION"
            git ls-remote --heads "$SUSFS_URL" | head -n 40
            exit 1
          fi
          echo "Using SUSFS branch: $SB"
          rm -rf ../susfs4ksu
          git clone --depth=1 -b "$SB" "$SUSFS_URL" ../susfs4ksu
          mkdir -p fs include/linux
          cp ../susfs4ksu/kernel_patches/fs/* fs/
          cp ../susfs4ksu/kernel_patches/include/linux/* include/linux/
          P=$(find ../susfs4ksu/kernel_patches -maxdepth 1 -name "50_add_susfs_in_*.patch" | sort -V | tail -n 1)
          if [ -z "$P" ]; then
            echo "::error::No SUSFS kernel patch found"
            ls ../susfs4ksu/kernel_patches
            exit 1
          fi
          echo "Applying SUSFS patch: $P"
          set +e
          patch -p1 --forward < "$P"
          set -e

          REJ=$(find . -name '*.rej' -not -path './out/*')
          if [ "$REJ" = "./fs/namespace.c.rej" ] && ! grep -q "susfs_def.h" fs/namespace.c; then
            echo "Applying the fs/namespace.c header hunk manually"
          python3 - << 'PYEOF'
          p = 'fs/namespace.c'
          s = open(p).read()
          a = '#include "pnode.h"\n'
          b = '#include "internal.h"\n'
          inc = '#ifdef CONFIG_KSU_SUSFS\n#include <linux/susfs_def.h>\n#endif // #ifdef CONFIG_KSU_SUSFS\n'
          ext = '#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n#define CL_COPY_MNT_NS BIT(25) /* used by copy_mnt_ns() */\n#endif // #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n\n'
          assert a in s and b in s, "anchor lines not found in fs/namespace.c"
          s = s.replace(a, inc + a, 1)
          s = s.replace(b, b + ext, 1)
          open(p, 'w').write(s)
          PYEOF
            rm -f fs/namespace.c.rej fs/namespace.c.orig
          fi
          REJ=$(find . -name '*.rej' -not -path './out/*')
          if [ -n "$REJ" ]; then
            echo "::error::SUSFS patch did not apply cleanly"
            for r in $REJ; do echo "----- $r"; cat "$r"; done
            exit 1
          fi
          echo "SUSFS patch applied. Checking fs/namespace.c header:"
          sed -n '25,60p' fs/namespace.c
          ls include/linux/susfs_def.h

          for cfg in arch/arm64/configs/*_defconfig; do
            sed -i '/CONFIG_KSU/d' "$cfg"
          done
          for sym in KSU KSU_SUSFS KSU_MANUAL_HOOK; do
            if [ "$sym" = "KSU" ] || grep -rqE "^config $sym\$" drivers/kernelsu fs/Kconfig; then
              echo "CONFIG_$sym=y" >> arch/arm64/configs/gki_defconfig
            fi
          done
          echo "Defconfig KSU lines:"
          grep -n "CONFIG_KSU" arch/arm64/configs/gki_defconfig

          cd "$GITHUB_WORKSPACE/android-kernel"
          B="${{ env.KERNEL_REL }}/BUILD.bazel"
          if grep -q "check_defconfig" "$B"; then
            sed -i 's/check_defconfig *= *"[a-z]*"/check_defconfig = "disabled"/' "$B"
          else
            sed -i '0,/name = "kernel_aarch64",/s//name = "kernel_aarch64",\n    check_defconfig = "disabled",/' "$B"
          fi
          grep -n "check_defconfig" "$B" || echo "check_defconfig not set"

      - name: Build boot.img
        run: |
          cd android-kernel
          mkdir -p ../dist_output out/dist
          TARGET="//${{ env.KERNEL_REL }}:kernel_aarch64_dist"
          if ! tools/bazel query "$TARGET" >/dev/null 2>&1; then
            echo "Target $TARGET not found, searching..."
            TARGET=$(tools/bazel query 'kind(copy_to_dist_dir, //...)' 2>/dev/null | grep -E 'kernel_aarch64_dist$' | head -n 1)
          fi
          if [ -z "$TARGET" ]; then
            echo "::error::No kernel_aarch64_dist target found"
            tools/bazel query 'kind(copy_to_dist_dir, //...)' 2>&1 | head -n 40
            exit 1
          fi
          {
            echo "WORKFLOW ksunext-susfs-v2 run ${{ github.run_number }}"
            echo "LINEAGE_BRANCH=${{ env.lineage_branch }}"
            echo "TARGET=$TARGET"
            echo "-----"
          } > ../build.log
          cat ../build.log
          set +e
          tools/bazel run --lto=thin --config=stamp "$TARGET" -- --destdir="$PWD/out/dist" >> ../build.log 2>&1
          RC=$?
          set -e
          tail -n 60 ../build.log
          if [ $RC -ne 0 ]; then
            echo "=========== BUILD FAILED (exit $RC) ==========="
            echo "----- first ERROR lines -----"
            grep -n -m 40 -E "ERROR|error:|fatal|FAILED|Unrecognized" ../build.log || true
            exit 1
          fi
          find out -type f -name "boot*.img"
          find out/dist -maxdepth 1 -name "Image*"
          BOOT=$(find out -type f -name boot.img | head -n 1)
          if [ -z "$BOOT" ]; then
            echo "::error::boot.img not found in output"
            find out -type f | head -n 50
            exit 1
          fi
          cp "$BOOT" ../dist_output/boot.img

      - name: Package AnyKernel3 zip
        run: |
          IMG=""
          for f in Image.lz4 Image.gz Image; do
            if [ -f "android-kernel/out/dist/$f" ]; then
              IMG="android-kernel/out/dist/$f"
              break
            fi
          done
          if [ -z "$IMG" ]; then
            echo "::error::No kernel Image found in out/dist"
            ls android-kernel/out/dist | head -n 50
            exit 1
          fi
          echo "Using kernel image: $IMG"
          cp "$IMG" AnyKernel3/
          ZIP="AK3-KSUNext-SUSFS-shiba-${{ env.lineage_branch }}-$(date +%Y%m%d).zip"
          cd AnyKernel3
          zip -r9 "../dist_output/$ZIP" . -x '.git*' 'README.md' '*placeholder'
          cd ..
          ls -la dist_output
          unzip -l "dist_output/$ZIP" | head -n 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore

      - name: Upload AnyKernel3 zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-shiba-${{ env.lineage_branch }}-KSUNext-SUSFS
          path: dist_output/AK3-*.zip
          if-no-files-found: error

      - name: Upload Raw boot.img
        uses: actions/upload-artifact@v4
        with:
          name: boot-shiba-${{ env.lineage_branch }}-kernelsu-next-susfs.img
          path: dist_output/boot.img
          if-no-files-found: error
