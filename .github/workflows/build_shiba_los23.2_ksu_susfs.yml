name: Build LineageOS 23.2 Shiba Kernel (KSU + SUSFS)

on:
  workflow_dispatch:

env:
  LOGS: ${{ github.workspace }}/diagnostic_logs
  MANIFEST: https://github.com/LineageOS/android_kernel_google_gs-6.1_manifest.git
  LOS_BRANCH: lineage-23.2
  KSU_URL: https://github.com/tiann/KernelSU.git
  KSU_SETUP_URL: https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh
  SUSFS_URL: https://gitlab.com/simonpunk/susfs4ksu.git
  SUSFS_BRANCH: gki-android14-6.1

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          mkdir -p $LOGS
          df -h / | tee $LOGS/disk_start.log

      - name: Install Dependencies
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig
          sudo curl -s https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo

      - name: Preflight
        run: |
          set -eo pipefail
          # LineageOS branch must exist
          git ls-remote --heads "$MANIFEST" | tee $LOGS/lineage_manifest_branches.log
          git ls-remote --exit-code --heads "$MANIFEST" "$LOS_BRANCH" > /dev/null \
            || { echo "ERROR: $LOS_BRANCH not found in $MANIFEST"; exit 1; }

          # SUSFS patches must exist
          git clone -q "$SUSFS_URL" -b "$SUSFS_BRANCH" /tmp/susfs
          PATCH_KSU=/tmp/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
          PATCH_KERNEL=/tmp/susfs/kernel_patches/50_add_susfs_in_${SUSFS_BRANCH}.patch
          for F in "$PATCH_KSU" "$PATCH_KERNEL"; do
            [ -f "$F" ] || { echo "ERROR: missing $F"; ls -R /tmp/susfs/kernel_patches | head -60; exit 1; }
          done

          # Find the newest KernelSU release tag that SUSFS's official patch applies to
          git clone -q --filter=blob:none "$KSU_URL" /tmp/ksu
          TAGS=$(git -C /tmp/ksu tag --list 'v[0-9]*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 40 || true)
          echo "Candidate tags: $(echo $TAGS | tr '\n' ' ')" | tee $LOGS/tag_search.log
          KSU_REF=""
          KSU_FUZZ=""
          for FUZZ in 0 2; do
            for T in $TAGS; do
              git -C /tmp/ksu checkout -q -f "$T"
              if (cd /tmp/ksu && patch -p1 --dry-run --fuzz=$FUZZ < "$PATCH_KSU") > /tmp/dry.log 2>&1; then
                echo "fuzz=$FUZZ tag=$T: APPLIES" | tee -a $LOGS/tag_search.log
                KSU_REF=$T; KSU_FUZZ=$FUZZ
                break 2
              else
                echo "fuzz=$FUZZ tag=$T: fails ($(grep -c FAILED /tmp/dry.log) failed hunks)" | tee -a $LOGS/tag_search.log
              fi
            done
          done
          [ -n "$KSU_REF" ] || { echo "ERROR: no KernelSU release tag accepts SUSFS's official patch"; exit 1; }
          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_FUZZ=$KSU_FUZZ" >> $GITHUB_ENV
          echo "Preflight OK: KernelSU $KSU_REF (fuzz $KSU_FUZZ), SUSFS $(git -C /tmp/susfs rev-parse HEAD), LineageOS $LOS_BRANCH" | tee $LOGS/preflight.log

      - name: Sync LineageOS Kernel Source
        run: |
          set -eo pipefail
          mkdir kernel_workspace && cd kernel_workspace
          git config --global user.name "Kernel Builder"
          git config --global user.email "bot@example.com"
          repo init -u "$MANIFEST" -b "$LOS_BRANCH" --depth=1
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --fail-fast 2>&1 | tee $LOGS/repo_sync.log
          repo manifest -r > $LOGS/manifest_resolved.xml
          git -C aosp log -1 --format='aosp HEAD: %H %s' | tee $LOGS/aosp_head.log

      - name: Integrate KernelSU
        run: |
          set -eo pipefail
          cd kernel_workspace/aosp
          curl -fLSs "$KSU_SETUP_URL" | bash -s "$KSU_REF" 2>&1 | tee $LOGS/ksu_setup.log
          [ -d KernelSU ] || { echo "ERROR: KernelSU directory not created"; exit 1; }
          GOT=$(git -C KernelSU describe --tags --exact-match HEAD)
          [ "$GOT" = "$KSU_REF" ] || { echo "ERROR: KernelSU is at '$GOT', expected '$KSU_REF'"; exit 1; }
          echo "KernelSU $GOT ($(git -C KernelSU rev-parse HEAD))" | tee $LOGS/ksu_version.log

      - name: Integrate SUSFS
        run: |
          set -eo pipefail
          WS=$GITHUB_WORKSPACE/kernel_workspace
          cd $WS
          git clone "$SUSFS_URL" -b "$SUSFS_BRANCH" susfs4ksu
          SUSFS=$WS/susfs4ksu

          {
            echo "Kernel: $(grep -E '^(VERSION|PATCHLEVEL|SUBLEVEL) =' aosp/Makefile | awk '{print $3}' | paste -sd.)"
            echo "LineageOS branch: $LOS_BRANCH"
            echo "KernelSU: $KSU_REF (patch fuzz $KSU_FUZZ)"
            echo "SUSFS branch: $SUSFS_BRANCH @ $(git -C $SUSFS rev-parse HEAD)"
            echo "Build date: $(date -u)"
          } | tee $LOGS/build_info.log

          # KernelSU-side SUSFS patch
          (cd aosp/KernelSU && patch -p1 --fuzz=$KSU_FUZZ --no-backup-if-mismatch < $SUSFS/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch) 2>&1 | tee $LOGS/patch_ksu.log

          # Kernel-side SUSFS sources and patch
          cp -r $SUSFS/kernel_patches/fs/* aosp/fs/
          cp -r $SUSFS/kernel_patches/include/linux/* aosp/include/linux/
          cd aosp
          PATCH=$SUSFS/kernel_patches/50_add_susfs_in_${SUSFS_BRANCH}.patch
          BASE=fs/proc/base.c

          # Add the dma-buf.h context include only if the patch needs it, and remove it afterwards.
          ADDED=0
          if ! patch -p1 --dry-run < $PATCH > $LOGS/patch_dryrun.log 2>&1; then
            echo "Dry run failed, adding dma-buf.h context line and retrying" | tee -a $LOGS/patch_dryrun.log
            grep -q '^#include <linux/dma-buf.h>' $BASE || {
              sed -i '/^#include <linux\/cpufreq_times.h>/a #include <linux/dma-buf.h>' $BASE
              ADDED=1
            }
          fi
          patch -p1 --no-backup-if-mismatch < $PATCH 2>&1 | tee $LOGS/patch_kernel.log
          if [ "$ADDED" = 1 ]; then
            sed -i '0,/^#include <linux\/dma-buf.h>$/{/^#include <linux\/dma-buf.h>$/d}' $BASE
          fi

          if [ -n "$(find . -name '*.rej')" ]; then
            echo "ERROR: rejected hunks:"; find . -name '*.rej' | tee $LOGS/rejects.log; exit 1
          fi
          git status --short | head -100 | tee $LOGS/modified_files.log

      - name: Configure and Build
        run: |
          set -eo pipefail
          cd kernel_workspace/aosp
          CONFIG_FILE="arch/arm64/configs/gki_defconfig"

          grep -rhoE '^[[:space:]]*config KSU[A-Z_]*' --include='Kconfig*' KernelSU/kernel fs | sort -u | tee $LOGS/config_symbols_found.log

          # Enable every SUSFS option that exists in the patched tree. KSU and KSU_SUSFS are mandatory.
          for OPT in KSU KSU_SUSFS KSU_SUSFS_SUS_PATH KSU_SUSFS_SUS_MOUNT KSU_SUSFS_SUS_KSTAT KSU_SUSFS_SUS_MAP \
                     KSU_SUSFS_SPOOF_UNAME KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG KSU_SUSFS_ENABLE_LOG \
                     KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS KSU_SUSFS_OPEN_REDIRECT \
                     KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
                     KSU_SUSFS_AUTO_ADD_TRY_EMPTY_DIR KSU_SUSFS_SUS_SU; do
            if grep -rqE "^[[:space:]]*config ${OPT}\$" --include='Kconfig*' KernelSU/kernel fs; then
              echo "CONFIG_${OPT}=y" >> $CONFIG_FILE
              echo "enabled: CONFIG_${OPT}" | tee -a $LOGS/config_check.log
            else
              echo "not in tree, skipped: CONFIG_${OPT}" | tee -a $LOGS/config_check.log
              if [ "$OPT" = "KSU" ] || [ "$OPT" = "KSU_SUSFS" ]; then
                echo "ERROR: required symbol CONFIG_${OPT} missing"; exit 1
              fi
            fi
          done

          grep -q '^CONFIG_SECCOMP=y' $CONFIG_FILE || echo "CONFIG_SECCOMP=y" >> $CONFIG_FILE
          grep -E 'CONFIG_(SECCOMP|KPROBES|KSU)' $CONFIG_FILE | tee $LOGS/defconfig_relevant.log

          cd ..
          tools/bazel run --config=shusky --verbose_failures //private/devices/google/shusky:zuma_shusky_dist 2>&1 | tee $LOGS/bazel_build.log

      - name: Stage Flashable Images
        id: stage
        run: |
          set -eo pipefail
          DIST=$(find kernel_workspace/out -type d -name dist | head -n1)
          [ -n "$DIST" ] || { echo "ERROR: no dist directory"; exit 1; }
          echo "dist=$DIST" >> $GITHUB_OUTPUT
          find "$DIST" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort | tee $LOGS/dist_contents.log

          mkdir -p $GITHUB_WORKSPACE/flashable_images
          for IMG in boot.img
